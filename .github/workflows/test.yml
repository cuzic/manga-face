name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same bytes must come out on every Node (the generator is pure; ADR 0001 D5)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # the version is package.json's packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  # The goldens (goldens/*.svg) are rebuilt and compared byte for byte. Faces have no text, so no fonts are involved: plain SVG is the same on every machine.
  # The whole gallery is rendered too and kept as an artifact, so a reviewer can look at it.
  golden:
    name: golden (goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the goldens match a rebuild
        run: pnpm golden
      - name: render the gallery
        run: pnpm gallery
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: out/*.svg
  # D7 stage and pixel checks run in Chromium. Keep the numbers even if a threshold fails.
  measure:
    name: measure (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm measure --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements
          path: out/measurements.json
      - name: generate stage gallery and blind check
        run: |
          node tools/stage.ts
          node tools/blind.ts
      - name: render before and after brow crops
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=$(mktemp -d)
          git fetch --depth=1 origin "$PR_BASE"
          git archive "$PR_BASE" src | tar -x -C "$baseline"
          node tools/brow-comparison.ts "$baseline/src/index.ts"
          node tools/png.mjs out/brows-before.svg out/brows-before.png
          node tools/png.mjs out/brows-after.svg out/brows-after.png
      - uses: actions/upload-artifact@v4
        with:
          name: stage-review
          path: |
            out/stage.svg
            out/blind.html
            out/brows-*.png
