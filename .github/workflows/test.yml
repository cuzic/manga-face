name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same bytes must come out on every Node (the generator is pure; ADR 0001 D5)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # the version is package.json's packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - if: matrix.node == 22
        run: |
          python3 -m venv "$RUNNER_TEMP/manga-face-fit"
          "$RUNNER_TEMP/manga-face-fit/bin/python" -m pip install pillow==13.0.0 jsonschema==4.26.0
          "$RUNNER_TEMP/manga-face-fit/bin/python" -m unittest discover -s tools/fit -p 'test_*.py'
  # The goldens (goldens/*.svg) are rebuilt and compared byte for byte. Faces have no text, so no fonts are involved: plain SVG is the same on every machine.
  # The whole gallery is rendered too and kept as an artifact, so a reviewer can look at it.
  golden:
    name: golden (goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the goldens match a rebuild
        run: pnpm golden
      - name: render the gallery
        run: pnpm gallery
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: out/*.svg
  # D7 stage and pixel checks run in Chromium. Keep the numbers even if a threshold fails.
  measure:
    name: measure (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright Chromium 1.62.1 pins Chromium 151.0.7922.34. Re-run the D7 measurements on upgrades:
      # the showcase minimum is 6.055 against a floor of 6.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm measure --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements
          path: out/measurements.json
      - run: node tools/stage.ts
      - name: generate blind quiz with the organizer's seed
        id: blind
        env:
          BLIND_QUIZ_SEED: ${{ secrets.BLIND_QUIZ_SEED }}
        run: |
          if [[ -n "$BLIND_QUIZ_SEED" ]]; then
            node tools/blind.ts "$BLIND_QUIZ_SEED"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: render before and after brow crops
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=$(mktemp -d)
          git fetch --depth=1 origin "$PR_BASE"
          git archive "$PR_BASE" src | tar -x -C "$baseline"
          node tools/brow-comparison.ts "$baseline/src/index.ts"
          node tools/png.mjs out/brows-before.svg out/brows-before.png
          node tools/png.mjs out/brows-after.svg out/brows-after.png
      - uses: actions/upload-artifact@v4
        with:
          name: stage-review
          path: |
            out/stage.svg
            out/brows-*.png
      - uses: actions/upload-artifact@v4
        if: steps.blind.outputs.generated == 'true'
        with:
          name: blind-quiz
          path: out/blind.html
          if-no-files-found: error
